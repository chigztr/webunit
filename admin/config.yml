backend:
  name: github
  repo: chigztr/webunit
  branch: main
  base_url: https://webunit-cms-auth.cvyas.workers.dev
  auth_endpoint: auth

site_url: https://webunit.co.uk
display_url: https://webunit.co.uk
logo_url: https://webunit.co.uk/favicon.svg

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - label: "WebUnit Products"
    name: "webunit_products"
    editor:
      preview: false
    files:
      - label: "Products & Deals"
        name: "products"
        file: "products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            fields:
              - label: "Section"
                name: "category"
                widget: "select"
                options:
                  - { label: "🔥 Today's Deals", value: "deals" }
                  - { label: "🏆 Chigz Picks", value: "picks" }
                  - { label: "📱 Smartphones", value: "phones" }
                  - { label: "🎥 Creator Gear", value: "creator" }
                  - { label: "📺 TV / Projector / Smart Home", value: "home" }

              - { label: "Product Name", name: "name", widget: "string" }

              - label: "Badge"
                name: "badge"
                widget: "string"
                required: false
                hint: "Examples: Deal, Hot Deal, Chigz Pick, Best Camera"

              - label: "Recommendation"
                name: "description"
                widget: "text"
                hint: "Keep this to one short sentence."

              - label: "Extra Info"
                name: "meta"
                widget: "string"
                required: false
                hint: "Example: Chigz Tech Score: 92/100 or current deal price."

              - label: "Affiliate / Buy Link"
                name: "affiliate"
                widget: "string"
                required: false
                default: "#"

              - label: "YouTube Review Link"
                name: "review"
                widget: "string"
                required: false
                default: "#"
                hint: "Used for Watch Review, automatic YouTube thumbnails and Video mode."

              - label: "Card Media"
                name: "media_type"
                widget: "select"
                required: false
                default: "image"
                options:
                  - { label: "Static Image", value: "image" }
                  - { label: "YouTube Video — click to play", value: "video" }

              - label: "Product Image"
                name: "image"
                widget: "image"
                required: false
                hint: "Optional. Static Image uses this first. Video mode uses it as the poster; leave blank to use the YouTube thumbnail."

  - label: "Section Management"
    name: "section_management"
    editor:
      preview: false
    files:
      - label: "Homepage Sections"
        name: "sections"
        file: "sections.json"
        format: "json"
        fields:
          - label: "Today's Deals"
            name: "deals"
            widget: "object"
            fields: &section_fields
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Order", name: "order", widget: "number", value_type: "int", min: 1, max: 20, default: 1, hint: "Lower numbers appear first." }
              - { label: "Show in Top Navigation", name: "showInNav", widget: "boolean", default: true }
              - { label: "Show Category Button", name: "showCategory", widget: "boolean", default: true }
              - { label: "Top Navigation Label", name: "navLabel", widget: "string" }
              - { label: "Category Button Label", name: "categoryLabel", widget: "string" }
              - { label: "Category Button Subtitle", name: "categorySubtitle", widget: "string", required: false }
              - { label: "Category Icon", name: "icon", widget: "string", required: false, hint: "Examples: ◆ ★ ▯ ◉ ⌂" }
              - { label: "Small Kicker", name: "kicker", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }

          - label: "Chigz Picks"
            name: "picks"
            widget: "object"
            fields: *section_fields

          - label: "Smartphones"
            name: "phones"
            widget: "object"
            fields: *section_fields

          - label: "Creator Gear"
            name: "creator"
            widget: "object"
            fields: *section_fields

          - label: "Home Tech"
            name: "home"
            widget: "object"
            fields: *section_fields

  - label: "Site Settings"
    name: "site_settings"
    editor:
      preview: false
    files:
      - label: "Homepage & Links"
        name: "settings"
        file: "settings.json"
        format: "json"
        fields:
          - { label: "Browser / SEO Title", name: "siteTitle", widget: "string" }
          - { label: "SEO Description", name: "metaDescription", widget: "text" }
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Headline — Line 1", name: "heroHeadline1", widget: "string" }

          - label: "Hero Headline — Line 2"
            name: "heroHeadline2"
            widget: "string"
            hint: "The final word is automatically highlighted in blue."

          - { label: "Hero Description", name: "heroCopy", widget: "text" }

          - label: "Hero Feature Image"
            name: "heroPortraitImage"
            widget: "image"
            required: false
            hint: "Optional. Upload a wide Chigz/tech image. Leave blank to use the bundled hero-scene.jpg."

          - { label: "YouTube Channel Link", name: "youtubeUrl", widget: "string" }

          - label: "YouTube Subscriber Count"
            name: "youtubeSubscriberCount"
            widget: "string"
            required: false
            default: "650K+"
            hint: "Manual display value, e.g. 689.4K+."

          - label: "YouTube Total View Count"
            name: "youtubeTotalViews"
            widget: "string"
            required: false
            default: "185M+"
            hint: "Manual display value, e.g. 198.1M+."

          - label: "Stats Channel URL"
            name: "chigzChannelUrl"
            widget: "string"
            required: false
            default: "https://Youtube.com/@ChigzTech"

          - label: "Stats Channel Label"
            name: "chigzChannelDisplayUrl"
            widget: "string"
            required: false
            default: "YouTube.com/@ChigzTech"

          - { label: "ChigzTech.com Link", name: "chigzTechUrl", widget: "string" }
          - { label: "Contact Email", name: "contactEmail", widget: "string" }
          - { label: "Footer Tagline", name: "footerTagline", widget: "string" }
          - { label: "Affiliate Disclosure", name: "affiliateDisclosure", widget: "text" }
          - { label: "Footer Credit", name: "footerCredit", widget: "string" }

          - { label: "Reviews CTA — Kicker", name: "reviewsKicker", widget: "string" }
          - { label: "Reviews CTA — Heading", name: "reviewsTitle", widget: "string" }
          - { label: "Reviews CTA — Description", name: "reviewsDescription", widget: "text" }
          - { label: "Reviews CTA — Button Label", name: "reviewsButtonLabel", widget: "string" }
