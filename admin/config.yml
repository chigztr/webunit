backend:
  name: github
  repo: chigztr/webunit
  branch: main
  site_domain: boisterous-marzipan-23bb34.netlify.app
  base_url: https://api.netlify.com
  auth_endpoint: auth

site_url: https://webunit.co.uk
display_url: https://webunit.co.uk
logo_url: https://webunit.co.uk/favicon.svg

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - label: "WebUnit Products"
    name: "webunit_products"
    editor:
      preview: false
    files:
      - label: "Products & Deals"
        name: "products"
        file: "products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            fields:
              - label: "Section"
                name: "category"
                widget: "select"
                options:
                  - { label: "🔥 Today's Deals", value: "deals" }
                  - { label: "🏆 Chigz Picks", value: "picks" }
                  - { label: "📱 Smartphones", value: "phones" }
                  - { label: "🎥 Creator Gear", value: "creator" }
                  - { label: "📺 TV / Projector / Smart Home", value: "home" }

              - label: "Product Name"
                name: "name"
                widget: "string"

              - label: "Badge"
                name: "badge"
                widget: "string"
                required: false
                hint: "Examples: Chigz Pick, Hot Deal, Best Camera, Tested by Chigz"

              - label: "Recommendation"
                name: "description"
                widget: "text"
                hint: "Keep this to one short sentence."

              - label: "Extra Info"
                name: "meta"
                widget: "string"
                required: false
                hint: "Example: Chigz Tech Score: 92/100"

              - label: "Affiliate / Buy Link"
                name: "affiliate"
                widget: "string"
                required: false
                default: "#"

              - label: "YouTube Review Link"
                name: "review"
                widget: "string"
                required: false
                default: "#"

              - label: "Product Image"
                name: "image"
                widget: "image"
                required: false
                hint: "Upload a WebP, JPG or PNG. Landscape/transparent product images work best."


  - label: "Site Settings"
    name: "site_settings"
    editor:
      preview: false
    files:
      - label: "Homepage & Links"
        name: "settings"
        file: "settings.json"
        format: "json"
        fields:
          - { label: "Browser / SEO Title", name: "siteTitle", widget: "string" }
          - { label: "SEO Description", name: "metaDescription", widget: "text" }
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Headline — Line 1", name: "heroHeadline1", widget: "string" }
          - { label: "Hero Headline — Line 2", name: "heroHeadline2", widget: "string" }
          - { label: "Hero Description", name: "heroCopy", widget: "text" }
          - { label: "YouTube Channel Link", name: "youtubeUrl", widget: "string" }
          - { label: "ChigzTech.com Link", name: "chigzTechUrl", widget: "string" }
          - { label: "Contact Email", name: "contactEmail", widget: "string" }
          - { label: "Footer Tagline", name: "footerTagline", widget: "string" }
          - { label: "Affiliate Disclosure", name: "affiliateDisclosure", widget: "text" }
          - { label: "Footer Credit", name: "footerCredit", widget: "string" }
          - { label: "Deals — Kicker", name: "dealsKicker", widget: "string" }
          - { label: "Deals — Heading", name: "dealsTitle", widget: "string" }
          - { label: "Deals — Description", name: "dealsDescription", widget: "text" }
          - { label: "Chigz Picks — Kicker", name: "picksKicker", widget: "string" }
          - { label: "Chigz Picks — Heading", name: "picksTitle", widget: "string" }
          - { label: "Chigz Picks — Description", name: "picksDescription", widget: "text" }
          - { label: "Smartphones — Kicker", name: "phonesKicker", widget: "string" }
          - { label: "Smartphones — Heading", name: "phonesTitle", widget: "string" }
          - { label: "Smartphones — Description", name: "phonesDescription", widget: "text" }
          - { label: "Creator Gear — Kicker", name: "creatorKicker", widget: "string" }
          - { label: "Creator Gear — Heading", name: "creatorTitle", widget: "string" }
          - { label: "Creator Gear — Description", name: "creatorDescription", widget: "text" }
          - { label: "Home Tech — Kicker", name: "homeKicker", widget: "string" }
          - { label: "Home Tech — Heading", name: "homeTitle", widget: "string" }
          - { label: "Home Tech — Description", name: "homeDescription", widget: "text" }
          - { label: "Reviews CTA — Kicker", name: "reviewsKicker", widget: "string" }
          - { label: "Reviews CTA — Heading", name: "reviewsTitle", widget: "string" }
          - { label: "Reviews CTA — Description", name: "reviewsDescription", widget: "text" }
          - { label: "Reviews CTA — Button Label", name: "reviewsButtonLabel", widget: "string" }
